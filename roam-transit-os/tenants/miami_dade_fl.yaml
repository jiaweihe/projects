# Pilot fixture (spec §11). Paratransit + AV network, phase 1 -> 3.
# Florida preempts local AV regulation. Via is the incumbent turnkey provider (displacement case).
id: miami_dade_fl
name: Miami-Dade County, FL
type: county
region: {country: US, state: FL, jurisdiction: Miami-Dade County}
timezone: America/New_York
phase: 1
modes: [paratransit, av_network]
zones:
  - {id: mdc_para, name: Miami-Dade paratransit area (core), mode: paratransit, geometry_file: zones/miami_dade_fl_paratransit.geojson}
  - {id: mdc_dt_odd, name: Downtown/Brickell AV ODD, mode: av_network, geometry_file: zones/miami_dade_fl_downtown_odd.geojson}
service_hours:
  mon: ["05:00", "23:00"]
  tue: ["05:00", "23:00"]
  wed: ["05:00", "23:00"]
  thu: ["05:00", "23:00"]
  fri: ["05:00", "23:00"]
  sat: ["06:00", "22:00"]
  sun: ["06:00", "22:00"]
fares:
  paratransit: {base: 3.50}          # VERIFY
  av_network: {base: 2.25}
booking_rules:
  paratransit: {min_advance_days: 1, max_advance_days: 7, booking_cutoff: "17:00", negotiation_window_min: 60, pickup_window_min: 30}
  av_network: {realtime: true, max_wait_min: 15}
ada_rules:
  denials_allowed: 0
  fixed_route_fare: 2.25             # VERIFY current Metrobus fare
fleet:
  - {adapter: human_driver, count: 12, seats: 8, wheelchair_positions: 2, prefix: MDC, max_range_km: 450}
  - {adapter: av_partner, count: 2, seats: 4, wheelchair_positions: 0, prefix: MDCAV, odd_zone_ids: [mdc_dt_odd], max_range_km: 300}
shifts:
  - {start: "04:45", end: "13:00", count: 12}
  - {start: "13:00", end: "21:15", count: 9}
  - {start: "15:00", end: "23:15", count: 3}
  - {start: "07:00", end: "21:00", count: 2, fleet_prefix: MDCAV}
depot: [-80.26, 25.79]
funding_sources:
  - {id: mdc_general, type: county, name: Miami-Dade County general fund}
branding: {display_name: Miami-Dade Roam (working name), primary_color: "#008080"}
compliance: {federal_funds: true, hipaa: true, title_vi: true, state_av_profile: null}
contacts:
  city_program_manager: transit-pm@miamidade.example.gov
  insurer: claims@insurance-pool.example.com
  police_fire: mdc-911-dispatch
