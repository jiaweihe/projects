[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roam-transit-os"
version = "0.1.0"
description = "Roam Transit OS: multi-tenant operating layer for city-owned paratransit, microtransit and AV networks (MVP v0.1)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "reportlab>=4",
]

[project.optional-dependencies]
routing = ["httpx>=0.27"]  # OSRM client
geo = ["h3>=4"]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
roam = "roam.cli:main"

[tool.setuptools.packages.find]
include = ["roam*"]

[tool.setuptools.package-data]
roam = ["web/*.html", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM"]
# B008: FastAPI's Depends()/Form() defaults are the framework idiom.
# UP042: StrEnum would change str()/f-string output of enums; not worth the risk in an MVP.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["roam"]
